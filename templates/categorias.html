{% extends 'base.html' %}
{% block content %}
<h2>Categorías del Menú</h2>
<div class="grid-container">
    {% for key, cat in categorias.items() %}
    <div class="card">
        <img src="{{ url_for('static', filename='images/' + cat.imagen) }}" alt="{{ cat.nombre }}">
        <h3>{{ cat.nombre }}</h3>
        <a href="{{ url_for('platos', cat_key=key) }}" class="btn">Explorar</a>
    </div>
    {% endfor %}
</div>
{% endblock %}
