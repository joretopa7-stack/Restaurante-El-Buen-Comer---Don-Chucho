{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <h2>Pedir: {{ plato.nombre }}</h2>
    <form method="POST">
        <div class="mb-3">
            <label for="num_mesa" class="form-label">Número de mesa</label>
            <select class="form-select" id="num_mesa" name="num_mesa" required>
                <option value="">Selecciona una mesa</option>
                {% for mesa in mesas %}
                <option value="{{ mesa.numero }}">Mesa {{ mesa.numero }} ({{ mesa.estado }})</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-success">Agregar al pedido</button>
        <a href="{{ url_for('cliente.detalle_plato', plato_id=plato.id) }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
